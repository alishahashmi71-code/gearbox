<!-- JAVASCRIPT TO FORCE VIDEO AUTOPLAY -->
<script>
(function() {
  'use strict';
  function initVideoBackground() {
    var video = document.getElementById('hero-video-bg');
    if (!video) { console.error('Hero video element not found'); return; }
    video.muted = true;
    video.playsInline = true;
    video.loop = true;
    video.autoplay = true;
    var playPromise = video.play();
    if (playPromise !== undefined) {
      playPromise
        .then(function() { console.log('✅ Hero video is playing'); })
        .catch(function(error) {
          console.error('❌ Video autoplay failed:', error);
          setTimeout(function() {
            video.play().catch(function(err) { console.error('❌ Second attempt failed:', err); });
          }, 500);
        });
    }
    video.addEventListener('error', function(e) {
      console.error('❌ Video loading error:', e);
    });
    video.addEventListener('loadeddata', function() { console.log('✅ Video data loaded'); });
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initVideoBackground);
  } else {
    initVideoBackground();
  }
  window.addEventListener('load', function() { setTimeout(initVideoBackground, 100); });
})();
</script>
